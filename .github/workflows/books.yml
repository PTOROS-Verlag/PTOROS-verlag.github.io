name: books

on:
  push:
    paths:
      - books/**
      - flake.nix
      - flake.lock
      - .github/workflows/books.yml
  pull_request:
    paths:
      - books/**
      - flake.nix
      - flake.lock
      - .github/workflows/books.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix build -L
