text = "Mein Blick fiel auf mehrere mit eigentümlichen Lettern bedeckte Drucktafeln. Es schien mir eine Art vergröberter griechischer Schrift zu sein, aber untermischt mit mir ganz unbekannten, barbarisch anmutenden Zeichen."

