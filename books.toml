[[book.quote]]
text = "„Bedenke, daß mich meine lieben Gäste in den Stand setzen, ==so meiner Wissenschaft zu leben, wie es bei uns kaum einer mehr kann.== In Italien, in Frankreich, in England erscheint kein Werk, keine Zeitschrift, die mir unerreichbar wären. In allen Sprachen kann ich allmonatlich lesen, was mir wichtig ist.“"

[[book.quote]]
