# the kartei: one card per book, in the order the website lists them. frontmatter, covers and
# website are generated from it.
#
# text uses typst markup: _emphasis_, *strong*, a line ending in `\` breaks the line, a blank
# line starts a paragraph. ==text== underlines a passage on the website and is plain elsewhere.

# trim size and bleed of every book, in mm
[format]
width = 125
height = 190
bleed = 3

# imprint wording per book language
[imprint.de]
by = "von"
design = "Umschlag, Satz und Layout gestaltet vom Herausgeber"
printing = "Druck und Bindung: Neopubli GmbH, Berlin"
printed = "Printed in Germany"

[imprint.la]
design = "Tegumentum et formam libri disposuit ipse qui edidit"
printing = "Typis excudit et colligavit societas Neopubli Berolinensis"
printed = "Printed in Germany"

[imprint.el]
design = "Ὁ ἐκδότης τὸ περικάλυμμα καὶ τὴν διάταξιν τῶν γραμμάτων κατεσκεύασεν."
printing = "Ἡ τύπωσις καὶ ἡ σύνδεσις ὑπὸ τῆς Neopubli GmbH, Berlin"
printed = "Ἐν Γερμανίᾳ ἐκτυπωθέν."

# fields of a card:
#   slug               directory under books/
#   language           de, la or el: imprint wording
#   title, subtitle, author
#   short-title        half-title and spine, if shorter than the title
#   cover-title        front cover, to break the title by hand
#   title-translation, author-translation   website, for titles not in german
#   by, by-author      title page byline, if not "von" and the author
#   edition            title page, below the author
#   source             imprint page, top: where the text comes from
#   typeface           imprint page
#   year, isbn, price, pages (as the shop counts them), spine (mm)
#   description        website, and back cover unless description-on-cover = false
#   quote              website and back cover; `website = false` or `cover = false` limits one
#   links              shop name to url

[[book]]
slug = "rueckert-weisheit-des-brahmanen"
language = "de"
title = "Die Weisheit des Brahmanen"
cover-title = '''
Die Weisheit \
des Brahmanen'''
subtitle = "Ein Lehrgedicht in Bruchstücken"
author = "Friedrich Rückert"
edition = "Ungekürzte Gesamtausgabe"
source = "Rückerts _Weisheit des Brahmanen_ erschien zuerst 1836–1839 in sechs Bänden in der Weidmannschen Buchhandlung in Leipzig."
typeface = "Schriften: EB Garamond und Alegreya Sans"
year = 2025
isbn = "978-3-81973-492-2"
price = 25
pages = 676
spine = 39
description = "*Friedrich Rückert*s imposantes Lehrgedicht _Die Weisheit des Brahmanen_, zwischen 1836 und 1839 in sechs Bänden erschienen, bündelt in einzigartiger Weise Anregungen aus Christentum, Islam, Hinduismus und abendländischer Philosophie."

[[book.quote]]
cover = false
source = "Hermann Hesse, _Das Glasperlenspiel_"
text = "Schließlich zog er einen abgebleichten Leinenband heraus, dessen Titel ›Weisheit des Brahmanen‹ ihn lockte. Stehend erst, dann sitzend blätterte er in dem Buch, das ==viele Hunderte von Lehrgedichten== enthielt, ==ein kurioses Nebeneinander von lehrhafter Gesprächigkeit und wirklicher Weisheit, von Philistrosität und echtem Dichtergeist==. Es fehlte diesem sonderbaren und rührenden Buch, so wollte es ihm scheinen, keineswegs an Esoterik, aber sie stak in derben hausbackenen Schalen, und nicht jene Gedichte darin waren die hübschesten, in welchen wirklich eine Lehre und Weisheit nach Gestalt strebte, sondern jene, in welchen des Dichters Gemüt, sein Liebesvermögen, seine Redlichkeit und Menschenliebe, sein bürgerlich gediegener Charakter Ausdruck fand."

[[book.quote]]
website = false
source = "I. 1."
text = '''
Ein indischer Brahman, geboren auf der Flur, \
Der nichts gelesen als den Weda der Natur; \
Hat viel gesehn, gedacht, noch mehr geahnt, gefühlt, \
Und mit Betrachtungen die Leidenschaft gekühlt; \
Spricht bald was klar ihm ward, bald um sich’s klar zu machen, \
Von ihn angeh’nden halb, halb nicht angeh’nden Sachen. \
Er hat die Eigenheit, nur Einzelnes zu sehn, \
Doch alles Einzelne als Ganzes zu verstehn. \
Woran er immer nur sieht schimmern einen Glanz, \
Wird ein Betkügelchen an seinem Rosenkranz.'''

[[book.quote]]
website = false
source = "XI. 1."
text = '''
Gar manches sagt nicht rein brahman’sches der Brahman; \
Sei es rein menschlich nur, so nehmen wir es an. \
Doch dieses, was aus gar zu fremden Augen schaut, \
Hat ein europischer Bekannter ihm vertraut.'''

[[book.quote]]
website = false
source = "VIII. 1."
text = '''
Ich glaube nicht, daß ich viel eignes neues lehre, \
Noch durch mein Scherflein Witz den Schatz der Weisheit mehre. \
Doch denk’ ich von der Müh mir zweierlei Gewinn; \
Einmal, daß ich nun selbst an Einsicht weiter bin; \
Sodann, daß doch dadurch an manchen Mann wird kommen \
Manches, wovon er sonst gar hätte nichts vernommen. \
Und auch der dritte Grund scheint werth nicht des Gelächters: \
Daß, wer dis Büchlein list, derweil doch list kein schlechters.'''

[book.links]
epubli = "https://www.epubli.com/shop/die-weisheit-des-brahmanen-9783819734922"
Amazon = "https://www.amazon.com/Die-Weisheit-Brahmanen-Ungek%C3%BCrzte-Gesamtausgabe/dp/3819734929"

[[book]]
slug = "gastmahl-der-schatten"
language = "de"
title = "Das Gastmahl der Schatten"
cover-title = '''
Das Gastmahl \
der Schatten'''
subtitle = '''
Roman von einer \
polnischen Allerseelennacht \
und Friedrich Chopin'''
author = "Julius Siber"
source = 'Zuerst erschienen im Paul Scheiner Verlag, Würzburg, 1937, mit der Widmung: "Dem einzigartigen Chopin-Interpreten _Raoul v. Koczalski_ zu eigen."'
typeface = 'Gesetzt aus der Garamond "Junicode"'
year = 2025
isbn = "978-3-565088-20-1"
price = 14
pages = 212
spine = 12
description = "_Das Gastmahl der Schatten_, letzter, rätselhaftester und verschollenster Roman des zu Lebzeiten weltberühmten Seelenfängers und Geigenvirtuosen *Julius Siber* (1871–1943), erschien 1937 als ==wortgewaltige Wiederheraufbeschwörung und zugleich literarische Letztverwahrung jenes okkultistisch durchwehten Kunstfanatismus==, der über weite Strecken des 19. Jahrhunderts die kulturellen Zentren und bedeutendsten Geister Europas in Bann schlug. Folgte die 1914 veröffentlichte _Seelenwanderung_, Sibers heute wohl bekanntester Roman, noch den Spuren eines Malers, dessen übernatürliche Ambition sich keineswegs in der Arbeit an der Leinwand erschöpft – denn niemals wird bei Siber bloß die Kunst durch ihren Schöpfer zur Magie, immer wächst vor allem ihr Schöpfer an der Kunst erst recht zum Magier empor –, so kehrt der fränkische Schriftsteller und Komponist sechs Jahre vor seinem Tod triumphal-mitreißend noch einmal zur eigenen und eigentlichsten Dämonie-Domäne und damit zu jener Kunstgattung zurück, der seit jeher die größte Zwingkraft über Sinne und Herzen der Menschen zugeschrieben wird: zur Musik. Im aufgewühlten Paris der Februarrevolution beginnt die fulminante Suche nach dem tödlichen Geheimnis hinter der sagenhaften Seelenmacht von Frédéric Chopin."

[[book.quote]]
text = "‚Mein Lied willst du? Ich glaub es dir. Du wärst der erste Klavierspieler der Welt. Liszt, Chopin, Kalkbrenner würden verschwinden neben dir. Du würdest die Seelen bezwingen wie das Steppenfeuer dürres Gras. Auf den Knien würde die Welt vor dir liegen. Der Zar auf seinem Throne, Metternich, die Giftspinne der Heiligen Allianz […], sie beide würden zittern, würden sie dich dieses Lied spielen hören, gleichwie damals Ludwig XV. zitterte, als ich es ihm in Marly vorspielte.‘"

[book.links]
epubli = "https://www.epubli.com/shop/das-gastmahl-der-schatten-9783565088201"
Amazon = "https://www.amazon.de/Das-Gastmahl-Schatten-polnischen-Allerseelennacht/dp/3565088206/"

